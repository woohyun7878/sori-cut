name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, and never cancel a run that is
# already in progress so production publishes are never interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # VITE_BENDER_API_URL is baked in at build time, so it has to be set here
      # rather than configured after deployment. Set the repository variable
      # once the backend is hosted (Settings > Secrets and variables > Actions >
      # Variables). Until then it is empty, the bundle falls back to localhost,
      # and the app says plainly that this build has no backend rather than
      # failing with a mixed-content error nobody can interpret.
      - name: Build web app
        env:
          VITE_BENDER_API_URL: ${{ vars.BENDER_API_URL }}
        run: pnpm --filter @bender/web build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
